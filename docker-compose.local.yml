services:
  postal-web:
    image: ghcr.io/postalserver/postal:latest
    restart: unless-stopped
    command: ["postal", "web-server"]
    ports:
      - "5000:5000"
    volumes:
      - "./docker/local-config:/config"
    environment:
      BIND_ADDRESS: "0.0.0.0"
      PORT: "5000"
      WAIT_FOR_TIMEOUT: 60
      WAIT_FOR_TARGETS: |-
        pole.hostitbro.com:3306

  postal-worker:
    image: ghcr.io/postalserver/postal:latest
    restart: unless-stopped
    command: ["postal", "worker"]
    volumes:
      - "./docker/local-config:/config"
    environment:
      WAIT_FOR_TIMEOUT: 60
      WAIT_FOR_TARGETS: |-
        pole.hostitbro.com:3306

  postal-smtp:
    image: ghcr.io/postalserver/postal:latest
    restart: unless-stopped
    command: ["postal", "smtp-server"]
    ports:
      - "2525:25"
    volumes:
      - "./docker/local-config:/config"
    environment:
      BIND_ADDRESS: "0.0.0.0"
      PORT: "25"
      WAIT_FOR_TIMEOUT: 60
      WAIT_FOR_TARGETS: |-
        pole.hostitbro.com:3306
